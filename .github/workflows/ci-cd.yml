name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

jobs:
  # 1. Validación de código con SonarQube (Solo para PRs desde ramas 'fix/')
  sonar-validation:
    if: github.event.pull_request.merged == false && startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Se utiliza el nombre calificado del plugin para corregir el error [9]
      - name: Compilar y Analizar con SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.projectKey=elprofevancho-uap_BACK-JOBS-API \
            -Dsonar.organization=elprofevancho-uap \
            -Dsonar.host.url=https://sonarcloud.io

  # 2. Generación de versión (Solo corre mientras el PR desde 'release/' está ABIERTO)
  create-release-version:
    if: github.event.pull_request.merged == false && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Crea el Tag y la versión antes de fusionar el código
      - name: Crear Versión / Release
        id: create_release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Despliegue en Render
  deploy:
    # 🚀 AHORA CORRE SI: El PR se fusionó OR si es un PR abierto que viene de una rama 'release/'
    if: >
      github.event.pull_request.merged == true || 
      (github.event.pull_request.merged == false && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Forzar Despliegue en Render via Actions
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"


