name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

jobs:
  # 1. Validación de código (Corre para ramas fix/ y release/ mientras el PR esté abierto)
  sonar-validation:
    if: github.event.pull_request.merged == false && (startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y Analizar con SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=elprofevancho-uap_BACK-JOBS-API \
            -Dsonar.organization=elprofevancho-uap \
            -Dsonar.host.url=https://sonarcloud.io

  # 2. Creación de versión AUTOMÁTICA (Corre en la rama origen MIENTRAS el PR de release sigue abierto)
  create-release-version:
    if: github.event.pull_request.merged == false && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }} # Se posiciona en la rama release/* para meter los tags de versión aquí

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Crear Versión Automática (Tags)
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Despliegue en Render (Solo se ejecuta cuando el PR es aprobado y fusionado en main)
  deploy:
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'fix/') || startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Render via Webhook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
